<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Devprint — GitHub fingerprints for humans and agents</title>
    <meta name="description" content="Turn any GitHub user or repo into a show-off card or an agent-ready context pack." />
    <meta property="og:title" content="Devprint — see the shape of any developer's work" />
    <meta property="og:description" content="GitHub user or repo → visual builder fingerprint + agent-ready context pack. Top Trumps-style battle card included." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://devprint.dev/" />
    <meta property="og:image" content="https://devprint.dev/og-default.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Devprint — see the shape of any developer's work" />
    <meta name="twitter:description" content="GitHub user or repo → visual builder fingerprint + agent-ready context pack." />
    <meta name="twitter:image" content="https://devprint.dev/og-default.svg" />
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="/src/spa/main.ts"></script>
    <!-- Cookie-free 1x1 beacon. Counts page loads only; the SPA also fires
         a per-render event from main.ts so we see which profiles get hit. -->
    <script>(function(){var s=location.hostname,p=location.pathname,r=document.referrer||'direct';new Image().src='https://echo.ai.hammant.io/analytics/t.gif?s='+encodeURIComponent(s)+'&p='+encodeURIComponent(p)+'&r='+encodeURIComponent(r)+'&_='+Date.now();})();</script>
  </body>
</html>
