<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bgA" cx="15%" cy="12%" r="60%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#7c5cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bgB" cx="86%" cy="18%" r="55%">
      <stop offset="0%" stop-color="#31d9ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#31d9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#31d9ff"/>
      <stop offset="50%" stop-color="#7c5cff"/>
      <stop offset="100%" stop-color="#ff5cc8"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cdd6ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="#070913"/>
  <rect width="1200" height="630" fill="url(#bgA)"/>
  <rect width="1200" height="630" fill="url(#bgB)"/>
  <g transform="translate(80,80)">
    <rect width="84" height="84" rx="22" fill="url(#mark)"/>
    <text x="110" y="58" font-family="Inter, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="-2">Devprint</text>
  </g>
  <g transform="translate(80,250)">
    <text font-family="Inter, sans-serif" font-size="78" font-weight="900" fill="url(#title)" letter-spacing="-3">
      <tspan x="0" y="0">See the shape of</tspan>
      <tspan x="0" y="92">any developer's work.</tspan>
    </text>
  </g>
  <g transform="translate(80,470)">
    <text font-family="Inter, sans-serif" font-size="28" fill="#9aa7c7">GitHub user or repo  →  visual builder fingerprint + agent-ready context pack.</text>
  </g>
  <g transform="translate(900,80)" opacity="0.85">
    <circle cx="120" cy="160" r="98" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="120" cy="160" r="156" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="120" cy="160" r="46" fill="url(#mark)"/>
    <circle cx="36" cy="106" r="20" fill="#62f0a7"/>
    <circle cx="216" cy="80" r="28" fill="#ff5cc8"/>
    <circle cx="216" cy="240" r="16" fill="#ffd166"/>
  </g>
  <g transform="translate(80,560)">
    <text font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#62f0a7">devprint.dev</text>
    <text x="190" font-family="Inter, sans-serif" font-size="22" fill="#9aa7c7">·  agents.devprint.dev</text>
  </g>
